      <text x="20" y="58" fill="rgba(255,255,255,.6)" font-size="12">Старт потока — 14 октября</text>
      <rect x="20" y="72" width="86" height="20" fill="#FFD84D"/>
      <text x="30" y="86" fill="#191933" font-size="11" font-weight="700">−30 %</text>
    </g>
