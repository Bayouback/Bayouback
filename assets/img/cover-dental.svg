    <path d="M-58 -62c0-30 26-46 58-46s58 16 58 46c0 34-14 46-20 84-5 32-12 52-24 52s-14-26-14-48-8-30-8-30-8 8-8 30-2 48-14 48-19-20-24-52c-6-38-20-50-20-84z"
