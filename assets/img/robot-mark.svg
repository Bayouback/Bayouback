<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="ЮВИ">
  <defs>
    <linearGradient id="m-shell" x1=".2" y1="0" x2=".7" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#E7EAEF"/>
    </linearGradient>
    <linearGradient id="m-visor" x1="0" y1="0" x2=".4" y2="1">
      <stop offset="0" stop-color="#2A2F3A"/><stop offset="1" stop-color="#0E1016"/>
    </linearGradient>
  </defs>

  <!-- антенна -->
  <path d="M32 12V8" stroke="#0B0B0C" stroke-width="2.4" stroke-linecap="round"/>
  <circle cx="32" cy="6" r="3.6" fill="#3E8BFF"/>

  <!-- боковые диски -->
  <circle cx="8"  cy="35" r="5.4" fill="url(#m-shell)" stroke="#0B0B0C" stroke-width="2.4"/>
  <circle cx="56" cy="35" r="5.4" fill="url(#m-shell)" stroke="#0B0B0C" stroke-width="2.4"/>

  <!-- голова -->
  <rect x="12" y="13" width="40" height="36" rx="13" fill="url(#m-shell)" stroke="#0B0B0C" stroke-width="2.6"/>
  <!-- визор -->
  <rect x="17" y="21" width="30" height="20" rx="9" fill="url(#m-visor)"/>
  <!-- глаза -->
  <g fill="#6FB4FF">
    <rect x="22" y="28" width="7" height="6" rx="3"/>
    <rect x="35" y="28" width="7" height="6" rx="3"/>
  </g>
  <path d="M19 26c3-2.6 8-3.6 12-3" stroke="#FFFFFF" stroke-width="1.6" opacity=".22" fill="none" stroke-linecap="round"/>

  <!-- парящие точки -->
  <g fill="#3E8BFF">
    <rect x="30.5" y="52" width="3" height="3" opacity=".85"/>
    <rect x="30.5" y="57" width="3" height="3" opacity=".4"/>
  </g>
</svg>
