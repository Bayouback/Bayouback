<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="ЮВИ">
  <defs>
    <radialGradient id="m-glass" cx="42%" cy="32%" r="72%">
      <stop offset="0" stop-color="#EAF4FF"/>
      <stop offset="1" stop-color="#C4DEFB"/>
    </radialGradient>
    <linearGradient id="m-brain" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8FC4FF"/>
      <stop offset="1" stop-color="#3E8BFF"/>
    </linearGradient>
  </defs>

  <!-- антенна -->
  <circle cx="32" cy="7" r="3.4" fill="#FFFFFF" stroke="#0B0B0C" stroke-width="2"/>
  <path d="M32 10.4v3.2" stroke="#0B0B0C" stroke-width="2" stroke-linecap="round"/>

  <!-- корпус головы -->
  <circle cx="32" cy="36" r="25" fill="#FFFFFF" stroke="#0B0B0C" stroke-width="2"/>

  <!-- стеклянный купол -->
  <circle cx="33" cy="35" r="19" fill="url(#m-glass)" stroke="#0B0B0C" stroke-width="2"/>

  <!-- мозг-облако -->
  <g fill="url(#m-brain)">
    <circle cx="27" cy="29" r="7"/>
    <circle cx="37" cy="28" r="6"/>
    <circle cx="32" cy="24" r="5.5"/>
    <circle cx="41" cy="33" r="4.5"/>
    <circle cx="23" cy="34" r="4.5"/>
  </g>

  <!-- сонные глаза -->
  <g fill="#0B0B0C">
    <rect x="-4" y="-2.4" width="8" height="4.8" rx="2.4" transform="translate(26.5 42) rotate(-12)"/>
    <rect x="-4" y="-2.4" width="8" height="4.8" rx="2.4" transform="translate(39.5 42) rotate(12)"/>
  </g>

  <!-- блик на стекле -->
  <ellipse cx="24" cy="26" rx="4" ry="2.4" fill="#FFFFFF" opacity=".7" transform="rotate(-32 24 26)"/>
</svg>
